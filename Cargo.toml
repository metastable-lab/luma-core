[package]
name = "luma-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sans-IO reverse-engineered BLE wire protocol for E09 / Watchfun-platform smart glasses."
readme = "README.md"
keywords = ["ble", "bluetooth", "protocol", "smart-glasses", "sans-io"]
categories = ["parser-implementations", "embedded"]

[lib]
name = "luma_core"
# `staticlib` is what an iOS app links, and it is deliberately NOT a
# `.framework`/`.xcframework` — a plain static archive plus generated Swift needs no
# binary-target plumbing.
#
# `cdylib` exists so `uniffi-bindgen` can introspect a host build to emit the bindings.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
# The ONLY dependency, and it is optional. With default features off this crate compiles
# against nothing but `std` — that is the point of the `uniffi` feature gate below.
#
# `default-features = false` is load-bearing, not tidiness. `uniffi`'s default feature is
# `cargo-metadata`, and `cli` implies `bindgen`; between them they drag `uniffi_bindgen`,
# `clap`, `askama` and `cargo_metadata` into the graph, and `cargo_metadata 0.23` depends on
# `cargo-platform 0.3.3`, which declares `rust-version = 1.91`. Every consumer inherits that
# floor. See the `bindgen` feature below.
uniffi = { version = "0.32", default-features = false, optional = true }

# Everything below is OPTIONAL and off by default. They exist so a laptop can drive the
# glasses end to end without an app — the sans-IO half of the crate stays dependency-free and
# every one of these sits behind a feature that names what it does.

# `wifi-client`: blocking HTTP for the Wi-Fi file API (§13). `default-features = false` drops
# rustls, gzip and serde — the file API is plain HTTP on 192.168.169.1 and has no use for any
# of them.
ureq = { version = "3", default-features = false, optional = true }

# `ble`: a real BLE central. btleplug is the portable one (CoreBluetooth / BlueZ / WinRT), and
# it is async, which is what drags tokio and futures in with it.
btleplug = { version = "0.13", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"], optional = true }
futures = { version = "0.3", optional = true }

# `opus`: decoding the wake-word stream to PCM. Binds to the SYSTEM libopus — `brew install
# opus` on macOS, `libopus-dev` on Debian — so this feature is the one most likely not to
# build on a given machine. Nothing else depends on it.
opus = { version = "0.3", optional = true }

[features]
default = []

# The UniFFI boundary: `src/ffi.rs`, the `setup_scaffolding!()` call and the `uniffi`
# dependency. Off by default so the pure Rust library has ZERO dependencies.
uniffi = ["dep:uniffi"]

# OFF by default, and it must stay that way: this is the bindings GENERATOR's toolchain, not
# the library's. `uniffi/cli` re-adds `bindgen` + `clap` + `camino` and
# `uniffi/cargo-metadata` re-adds `cargo_metadata` — all of which stay out of every build that
# only wants the library (the iOS staticlib, the Android `.so`s).
#
# The `[[bin]]` below declares `required-features = ["bindgen"]`, so a plain `cargo build` or
# `cargo test` silently skips the binary rather than failing.
bindgen = ["uniffi", "uniffi/cli", "uniffi/cargo-metadata"]

# The Wi-Fi file API client: `client::fileapi::FileClient`, and `examples/gallery.rs`.
# Adds one dependency (ureq) and no async runtime.
wifi-client = ["dep:ureq"]

# A BLE central: `client::ble::Glasses`, and `examples/luma.rs`. This is the feature that turns
# the crate from a protocol library into a laptop client.
ble = ["dep:btleplug", "dep:tokio", "dep:futures"]

# Opus decode + a WAV writer: `client::opus`. Needs the system libopus; see the dependency note.
opus = ["dep:opus"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[example]]
name = "decode"
path = "examples/decode.rs"

[[example]]
name = "commands"
path = "examples/commands.rs"

# std only: the whole live-view path (RTSP over TCP, RTP over UDP) with no dependency at all.
[[example]]
name = "live"
path = "examples/live.rs"

[[example]]
name = "gallery"
path = "examples/gallery.rs"
required-features = ["wifi-client"]

[[example]]
name = "luma"
path = "examples/luma.rs"
required-features = ["ble"]
