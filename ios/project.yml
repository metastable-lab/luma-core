name: LumaDemo
options:
  bundleIdPrefix: luma.core
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  # The generated UniFFI Swift bindings, as a LOCAL package so the app reaches the
  # Rust protocol with one `import LumaCore`. Its sources are produced by
  # `ios/build-core.sh` — run that before opening this project or the package
  # resolves to an empty module.
  LumaCore:
    path: LumaCore
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # These two link the Rust static archive, and they MUST sit at PROJECT level
    # inside this `base:` block. At target level the app links clean while any test
    # bundle fails on undefined `uniffi_luma_core_*` symbols, which reads as a
    # test bug and is not one.
    #
    # A plain `.a` per SDK rather than an `.xcframework` or an SPM `.binaryTarget`:
    # nothing here is an opaque vendor blob, and a static archive needs no
    # binary-target plumbing. Both paths are produced by `ios/build-core.sh` and are
    # gitignored.
    OTHER_LDFLAGS: -lluma_core
    # `ios/build-core.sh` builds `aarch64-apple-ios-sim` only, so there is no x86_64
    # slice to link against. Excluding it keeps an Apple-silicon Simulator build from
    # failing on an architecture nobody here targets; add the x86_64 triple to
    # build-core.sh if an Intel Mac ever needs it.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(SRCROOT)/lib/ios-arm64
    LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(SRCROOT)/lib/ios-arm64-sim
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  LumaDemo:
    type: application
    platform: iOS
    sources:
      - LumaDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: luma.core.demo
        PRODUCT_NAME: "LumaDemo"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LumaDemo/Info.plist
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        # The Simulator is supported so the UI compiles and can be inspected without a
        # device. It has no Bluetooth radio, so a real connection still needs a phone.
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    info:
      path: LumaDemo/Info.plist
      properties:
        CFBundleDisplayName: Glasses
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Required: scanning without it is an immediate crash on first use.
        NSBluetoothAlwaysUsageDescription: >-
          This demo connects to smart glasses over Bluetooth to read their state and
          send protocol commands.
    dependencies:
      - package: LumaCore
        product: LumaCore
    # Declared so a SHARED scheme is generated and committed. Without it xcodebuild
    # autocreates a scheme into the user's own DerivedData, which works locally and
    # then does not exist on a fresh clone.
    scheme:
      testTargets: []
      gatherCoverageData: false
